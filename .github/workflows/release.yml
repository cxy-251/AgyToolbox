name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: dotnet publish -c Release

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "bin/Release/net8.0-windows/publish/*" -DestinationPath "AgyToolbox-${{ github.ref_name }}-win.zip"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: AgyToolbox-${{ github.ref_name }}-win.zip
          draft: true
          generate_release_notes: true
